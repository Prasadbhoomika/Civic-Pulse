services:
  mongodb:
    image: mongo:7
    container_name: civicpulse-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: civicpulse
    volumes:
      - mongodb_data:/data/db
    networks:
      - civicpulse
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: civicpulse-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/civicpulse
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DUPLICATE_RADIUS_METERS: ${DUPLICATE_RADIUS_METERS:-150}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - civicpulse
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: civicpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civicpulse

networks:
  civicpulse:

volumes:
  mongodb_data:
  uploads_data:
