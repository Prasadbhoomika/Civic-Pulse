apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB_USER/civicpulse-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: civicpulse-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
